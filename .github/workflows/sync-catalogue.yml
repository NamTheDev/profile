name: Refresh project catalogue
on:
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/sync_catalogue.py'
      - '.github/workflows/sync-catalogue.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Refresh all metadata or a selected YouTube channel'
        type: choice
        options: [all, youtube, music, ashes]
        default: all
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_catalogue.py'
      - id: refresh
        run: python scripts/sync_catalogue.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CATALOGUE_CHANNEL: ${{ inputs.channel || 'all' }}
      - name: Commit refreshed public metadata
        run: |
          git diff --quiet -- data/catalogue.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          git commit -m "Update: Refresh public project catalogue" -m "$(date -u +%d-%m-%Y)" -m "- Refresh public repository and channel metadata automatically"
          git push
      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
