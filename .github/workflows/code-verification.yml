name: Profile code verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js && node --check js/marquee.js
      - run: node --check js/projects.js
      - run: python3 -m py_compile scripts/sync_catalogue.py
      - run: node --check sw.js
      - run: node --test tests/service-worker.test.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 marked@15.0.12 dompurify@3.2.6
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/ui.test.cjs
