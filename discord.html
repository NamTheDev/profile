<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link href="http://fonts.cdnfonts.com/css/whitney-2" rel="stylesheet" /> -->
    <link rel="stylesheet" href="/assets/css/discord.css" />
    <title>Discord Profile Card</title>
</head>

<body>
    <div class="card-container">
        <div class="card">
            <div class="card-header">
                <div style="background: url('./assets/img/banner.png')" class="banner-image"></div>
                <div class="infos">
                    <div class="profil-logo">
                        <img src="./assets/img/logo.png" />
                    </div>
                    <div class="username"><b id="displayname"></b> <span id="username"></span></div>
                    <hr />
                </div>
            </div>
            <div class="card-content">
                <div class="about-me">
                    <div class="category-title">About Me</div>
                    <p id="about"></p>
                </div>
                <div class="note">
                    <div class="category-title">Note</div>
                    <textarea placeholder="Click for add a note"></textarea>
                </div>
            </div>
        </div>
    </div>
    <script src="/assets/js/main.js"></script>
    <script src="https://sybraxdesign.fr/api/github/main.js"></script>
</body>

</html>
