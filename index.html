<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Nam's self-documentary: notes, history, work, and personal records.">
  <title>Nam — Self-documentary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="icon-button mobile-only" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <a class="site-brand" id="home-link" href="?page=home">
        <span class="brand-name">Nam</span>
      </a>

      <div class="header-spacer"></div>
    </div>
  </header>

  <div class="page-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <section class="sidebar-block">
          <h2 class="interface-heading">Pages</h2>
          <input id="page-filter" class="page-filter" type="search" placeholder="Filter pages" autocomplete="off" aria-label="Filter pages">
          <nav id="page-nav" class="page-nav" aria-label="Document pages"></nav>
        </section>
      </div>
    </aside>

    <main class="main" id="main-content">
      <article id="article" class="article" aria-live="polite">
        <p class="loading">Loading…</p>
      </article>
    </main>

    <aside class="toc-panel" aria-label="On this page">
      <div class="toc-inner">
        <h2 class="interface-heading">Contents</h2>
        <nav id="toc" class="toc"></nav>
      </div>
    </aside>
  </div>

  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <noscript>
    <div class="noscript">This site requires JavaScript to load Markdown pages.</div>
  </noscript>
</body>
</html>
